name: Rakna Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Fix and Build
        run: |
          rm -rf android
          flutter create -t app . --org com.rakna.app --project-name rakna --platforms android --overwrite
          cat > pubspec.yaml << 'EOF'
          name: rakna
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            google_maps_flutter: 2.5.0
          flutter:
            uses-material-design: true
          EOF
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:google_maps_flutter/google_maps_flutter.dart';
          import 'dart:async'; import 'dart:math';
          void main()=>runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: Rakna()));
          class Rakna extends StatefulWidget{const Rakna({super.key}); @override State<Rakna> createState()=> _RaknaState(); }
          class _RaknaState extends State<Rakna>{
            LatLng myPos=const LatLng(30.0626,31.2194); List<Marker> markers=[]; int points=12; int countdown=120; Timer? timer; String? reservedId;
            @override void initState(){super.initState(); _loadSpots();}
            void _loadSpots(){ var rnd=Random(); List<Marker> m=[]; m.add(Marker(markerId: const MarkerId('me'), position: myPos, infoWindow: const InfoWindow(title: 'انت هنا'))); for(int i=0;i<3;i++){ var p=LatLng(myPos.latitude+(rnd.nextDouble()-0.5)*0.006, myPos.longitude+(rnd.nextDouble()-0.5)*0.006); m.add(Marker(markerId: MarkerId('spot_$i'), position: p, icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueGreen), infoWindow: InfoWindow(title: 'ركنة هتفضى 🟢', snippet: 'دوس للحجز', onTap: (){ _reserve('spot_$i'); }))); } setState(()=>markers=m); }
            void _reserve(String id){ setState(()=>reservedId=id); countdown=120; timer?.cancel(); timer=Timer.periodic(const Duration(seconds:1), (t){ if(countdown>0){ setState(()=>countdown--);} else { t.cancel(); setState(()=>reservedId=null); } }); }
            void _confirmPark(){ timer?.cancel(); setState((){ points+=2; reservedId=null; }); _loadSpots(); }
            @override Widget build(BuildContext context){ return Scaffold(body: Stack(children:[ GoogleMap(initialCameraPosition: CameraPosition(target: myPos, zoom: 16), markers: Set.from(markers)), SafeArea(child: Container(margin:const EdgeInsets.all(16), padding:const EdgeInsets.all(12), decoration:BoxDecoration(color:Colors.black, borderRadius:BorderRadius.circular(16)), child:Row(mainAxisAlignment:MainAxisAlignment.spaceBetween, children:[ Text(reservedId!=null?'${countdown~/60}:${(countdown%60).toString().padLeft(2,'0')}':'ركنة - WORKFLOW', style:const TextStyle(color:Colors.white, fontWeight:FontWeight.bold)), Container(padding:const EdgeInsets.symmetric(horizontal:10, vertical:6), decoration:BoxDecoration(color:Colors.white, borderRadius:BorderRadius.circular(20)), child: Text('$points نقطة', style:const TextStyle(fontWeight:FontWeight.bold)))]))), Positioned(bottom:0, left:0, right:0, child: Container(padding:const EdgeInsets.all(20), decoration:const BoxDecoration(color:Colors.white, borderRadius:BorderRadius.vertical(top:Radius.circular(24))), child: reservedId==null?Column(children:[ SizedBox(width:double.infinity, height:56, child:ElevatedButton(onPressed:_loadSpots, style:ElevatedButton.styleFrom(backgroundColor:Colors.black), child:const Text('1- بدور على ركنة (SEARCH)', style:TextStyle(color:Colors.white)))), const SizedBox(height:10), SizedBox(width:double.infinity, height:56, child:OutlinedButton(onPressed:(){ setState(()=>points+=5); _loadSpots(); }, child:const Text('2- طالع من ركنتي (PUBLISH +5)')))]):Row(children:[ Expanded(child:ElevatedButton(onPressed:_confirmPark, style:ElevatedButton.styleFrom(backgroundColor:Colors.green), child:const Text('ركنت خلاص (COMPLETED)', style:TextStyle(color:Colors.white)))), const SizedBox(width:10), Expanded(child:OutlinedButton(onPressed:(){ timer?.cancel(); setState(()=>reservedId=null); }, child:const Text('الغاء'))) ]))) ])); }
          }
          DART
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rakna-apk
          path: build/app/outputs/flutter-apk/app-release.apk
