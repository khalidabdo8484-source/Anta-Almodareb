name: Rakna Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Fix Gradle Project
        run: |
          # نحفظ الكود بتاعك
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          # نمسح المشروع القديم البايظ
          rm -rf android ios
          # نعمل مشروع جديد نضيف بنفس الاسم
          flutter create -t app . --org com.rakna.app --project-name rakna
          # نرجع الكود بتاعك تاني
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK - Rakna Offline
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rakna-apk
          path: build/app/outputs/flutter-apk/app-release.apk
