name: Rakna Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Clean and Re-create Android folder
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create -t app . --org com.rakna.app --project-name rakna --overwrite
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          # نظبط الـ pubspec للأوفلاين
          cat > pubspec.yaml << 'EOF'
          name: rakna
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            google_maps_flutter: ^2.5.3
            geolocator: ^10.1.0
            fluttertoast: ^8.2.6
          flutter:
            uses-material-design: true
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rakna-apk
          path: build/app/outputs/flutter-apk/app-release.apk
